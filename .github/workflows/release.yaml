# Push a tag <upstream version>-<n> on a commit of main, see "Releases" in the
# README: the upstream release the fork is based on, and a build number that
# counts the releases of this fork on top of it.
on:
  push:
    tags:
      - '*.*.*-*'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write # the image on ghcr.io
      id-token: write # keyless cosign signature and provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-[1-9][0-9]*$ ]]; then
            echo "::error::tag $TAG is not <upstream version>-<n>"
            exit 1
          fi
          base=${BASH_REMATCH[1]}
          if ! git merge-base --is-ancestor "refs/tags/$base" HEAD 2>/dev/null; then
            echo "::error::upstream release $base is not in the history of $TAG"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag $TAG is not on main"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.19.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Build and push the image
        id: ko
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # ko prints the pushed reference with its digest, the multi-platform index
          ref=$(ko build --bare --tags "$TAG" --platform linux/amd64,linux/arm64 .)
          name=${ref%@*}
          name=${name%:"$TAG"}
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
      - name: Sign the image
        env:
          IMAGE: ${{ steps.ko.outputs.name }}@${{ steps.ko.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ko.outputs.name }}
          subject-digest: ${{ steps.ko.outputs.digest }}
          push-to-registry: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.ko.outputs.name }}
          DIGEST: ${{ steps.ko.outputs.digest }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
            --notes "Image: \`$IMAGE:$TAG@$DIGEST\`, signed with cosign, see Releases in the README."
